<!DOCTYPE html>
  <html lang="pt-br">
  <head>
  <meta charset="UTF-8" />
  <title>Painel de Chamados - Fadex Helpdesk</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <h1>Painel de Chamados em Tempo Real</h1>
  <div class="sub">Diferencial — atualização automática via Server-Sent Events (SSE)</div>

  <div class="login-box">
    <input id="token" type="text" placeholder="Cole aqui o token JWT (obtido em /api/auth/login)" style="min-width:360px" />
    <button onclick="conectar()">Conectar</button>
    <span id="statusConexao" class="status"><span class="dot" style="background:#64748b"></span>desconectado</span>
  </div>

  <div class="grid" id="statusGrid"></div>
  <div class="grid" id="prioridadeGrid"></div>

  <h3> Alertas de prioridade ALTA</h3>
  <div id="alertas"><span class="status">Nenhum alerta ainda.</span></div>

<script>
  let evtSource = null;

  function renderCards(containerId, dados, isPrioridade) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    Object.entries(dados).forEach(([chave, valor]) => {
      const div = document.createElement('div');
      div.className = 'card';
      const isAlta = isPrioridade && chave === 'ALTA';
      div.innerHTML = `<div class="label">${chave.replace('_',' ')}</div><div class="value ${isAlta ? 'alta' : ''}">${valor}</div>`;
      container.appendChild(div);
    });
  }

  function atualizarIndicadores(dados) {
    renderCards('statusGrid', dados.porStatus, false);
    renderCards('prioridadeGrid', dados.porPrioridade, true);
  }

  function adicionarAlerta(msg) {
    const container = document.getElementById('alertas');
    if (container.children[0]?.className !== 'alerta') container.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'alerta';
    div.textContent = `${new Date().toLocaleTimeString()} — ${msg}`;
    container.prepend(div);
  }

  function conectar() {
    const token = document.getElementById('token').value.trim();
    if (!token) { alert('Cole o token JWT primeiro (faça login via /api/auth/login).'); return; }
    if (evtSource) evtSource.close();

    evtSource = new EventSource(`/api/dashboard/stream?token=${encodeURIComponent(token)}`);
    const statusEl = document.getElementById('statusConexao');

    evtSource.onopen = () => { statusEl.innerHTML = '<span class="dot"></span>conectado (tempo real)'; };
    evtSource.onerror = () => { statusEl.innerHTML = '<span class="dot" style="background:#ef4444"></span>erro de conexão'; };

    evtSource.addEventListener('snapshot', (e) => atualizarIndicadores(JSON.parse(e.data)));
    evtSource.addEventListener('indicadores', (e) => atualizarIndicadores(JSON.parse(e.data)));
    evtSource.addEventListener('alerta-prioridade-alta', (e) => adicionarAlerta(JSON.parse(e.data).mensagem));
  }
</script>
</body>
</html>
